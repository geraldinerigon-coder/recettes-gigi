name: Update Ratings

on:
  repository_dispatch:
    types: [update-rating]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Update rating
        run: |
          echo "$PAYLOAD" > payload.json
          node update-rating.js

      - name: Commit and push
        run: |
          git config user.name "Gigi Bot"
          git config user.email "actions@github.com"
          git add ratings.json
          git commit -m "Update ratings"
          git push
    env:
      PAYLOAD: ${{ github.event.client_payload }}
